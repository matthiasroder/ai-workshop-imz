<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">IMZ Academy · AI Agents</title>
  <desc id="desc">Instagram Story overlay for the AI Agents workshop with Matthias Röder in Vienna on 5 November 2026. The center is transparent for a full-bleed photo.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090B" stop-opacity=".70"/>
      <stop offset=".64" stop-color="#09090B" stop-opacity=".70"/>
      <stop offset="1" stop-color="#09090B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090B" stop-opacity="0"/>
      <stop offset=".22" stop-color="#09090B" stop-opacity=".60"/>
      <stop offset=".61" stop-color="#09090B" stop-opacity=".86"/>
      <stop offset="1" stop-color="#09090B" stop-opacity=".96"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="570" fill="url(#header)"/>
  <rect y="992" width="1080" height="928" fill="url(#footer)"/>
  <g id="imz-academy-mark">
    <rect x="72" y="267" width="256" height="115" fill="#fff"/>
    <image x="85" y="281" width="230" height="87" xlink:href="data:image/png;base64,"/>
  </g>
  <g fill="#fff" font-family="Helvetica Neue, Helvetica, sans-serif">
    <g text-anchor="end" font-size="29" font-weight="600" letter-spacing="2.7">
      <text x="1008" y="314">VIENNA</text>
      <text x="1008" y="357">05 NOV 2026</text>
    </g>
    <path d="M72 417H1008" stroke="#fff" stroke-width="2" opacity=".7"/>
    <g id="workshop-details">
      <text x="76" y="1226" font-size="27" font-weight="700" letter-spacing="4.5">HANDS-ON WORKSHOP</text>
      <text x="64" y="1394" font-size="176" font-weight="700" letter-spacing="-8">AI Agents</text>
      <path d="M913 1377H961V1363L1008 1385H913Z"/>
      <text x="76" y="1463" font-size="44" font-weight="500" letter-spacing="-.65">for Content Creation + Administration</text>
      <text x="76" y="1526" font-size="32" font-weight="500">with Matthias Röder</text>
    </g>
  </g>
